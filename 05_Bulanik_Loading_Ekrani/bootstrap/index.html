<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Rubik+Moonrocks&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <title>Bulanık Loading - Bootstrap</title>
</head>
<body>
   <!--Arka Plan Bulanık--> 
    <div id="bg" class=" bg position-absolute top-0 start-0 w-100 h-100
    "
    style="background-image: url('https://wallpaperaccess.com/full/6549944.png'); 
    background-size:cover;  
    background-position: center; 
    filter:blur(30px); 
    z-index:-1;
    transition: filter 1s ease;">
    </div>

    <!--Yükleme Metni-->
    <div class="d-flex justify-content-center align-items-center vh-100">
        <p class="loading-text display-1 fw-bold text-warning m-0" style="font-family: 'Rubik Moonrocks', cursive;">
            0%
        </p>
    </div>
    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
